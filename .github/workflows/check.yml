# Two jobs, deliberately separate.
#
# `tests` runs on every push and guards the repo: the Scholar parser, and the
# data files against each other. It is the gate on a pipeline run.
#
# `monitor` watches the deployed site and the things it depends on that nobody
# here controls — jsDelivr, Hugging Face, and the Ex Ordo programme. It ran
# daily until the conference was over; the schedule was removed on 17 Nov 2026
# because the site is an archive nobody is maintaining, and GitHub had already
# auto-disabled the cron after 60 days without a push. Run it by hand
# (workflow_dispatch) if you want to know the site is still up. To bring the
# daily run back for a 2027 programme, restore:
#
#   schedule:
#     - cron: "12 7 * * *"   # not on the hour: GitHub queues :00 together

name: check

on:
  push:
  pull_request:
  workflow_dispatch:

# Neither job writes anything, and a public repo gets pull requests from people
# whose code these jobs then run. `pull_request` (rather than
# `pull_request_target`) already means a fork's PR gets a read-only token and no
# secrets, so this is belt and braces — but it is the sort of default that
# drifts, and stating it costs two lines.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node test/parse.test.mjs
      - run: node test/data.test.mjs

  monitor:
    # Only by hand: on a push the site hasn't deployed yet, so it would check
    # the previous version and report on the wrong thing.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node test/monitor.mjs https://mikefsway.github.io/rgs-agenda/
